# Deletes the comments github-actions[bot] posted on a discussion (Actions › Discussion comment › Run workflow).
name: Discussion comment
on:
  workflow_dispatch:
    inputs:
      number:
        description: Discussion number
        required: true
permissions:
  discussions: write
jobs:
  delete-bot-comments:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
        run: |
          ids="$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){discussion(number:$n){comments(last:100){nodes{id author{login}}}}}}' \
            -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" -F n="$NUMBER" \
            --jq '.data.repository.discussion.comments.nodes[] | select(.author.login=="github-actions") | .id')"
          [ -n "$ids" ] || { echo "no bot comment on #$NUMBER"; exit 1; }
          for id in $ids; do
            gh api graphql -f query='mutation($i:ID!){deleteDiscussionComment(input:{id:$i}){comment{id}}}' -f i="$id" >/dev/null && echo "deleted $id"
          done
