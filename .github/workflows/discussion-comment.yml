# Posts a comment on a discussion of this repository (Actions › Discussion comment › Run workflow).
# The comment is posted by github-actions[bot].
name: Discussion comment
on:
  workflow_dispatch:
    inputs:
      number:
        description: Discussion number
        required: true
      body:
        description: Comment (Markdown)
        required: true
permissions:
  discussions: write
jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          BODY: ${{ inputs.body }}
        run: |
          id="$(gh api graphql -f query='query($o:String!,$r:String!,$n:Int!){repository(owner:$o,name:$r){discussion(number:$n){id}}}' \
            -f o="${GITHUB_REPOSITORY%/*}" -f r="${GITHUB_REPOSITORY#*/}" -F n="$NUMBER" --jq .data.repository.discussion.id)"
          [ -n "$id" ] && [ "$id" != "null" ] || { echo "discussion #$NUMBER not found"; exit 1; }
          gh api graphql -f query='mutation($d:ID!,$b:String!){addDiscussionComment(input:{discussionId:$d,body:$b}){comment{url}}}' \
            -f d="$id" -f b="$BODY" --jq .data.addDiscussionComment.comment.url
