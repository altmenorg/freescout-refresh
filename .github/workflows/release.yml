# Publishes a GitHub release: Refresh.zip (git archive, export-ignore applied, folder Refresh/), module.json and
# SHA256SUMS. Started by a pushed version tag (vX.Y.Z, its annotation = title + notes), or by hand (Actions › Release ›
# Run workflow) on a branch: the tag v<module.json version> is created on that commit, with the notes given.
name: Release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      notes:
        description: Release notes (Markdown)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Version, title and notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          v="v$(jq -r .version module.json)"
          mkdir dist
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ "$v" = "$GITHUB_REF_NAME" ] || { echo "module.json says $v, tag is $GITHUB_REF_NAME"; exit 1; }
            git fetch -f origin "refs/tags/$v:refs/tags/$v"
            git tag -l --format='%(contents:subject)' "$v" > dist/title.txt
            git tag -l --format='%(contents:body)' "$v" > dist/notes.md
          else
            if git ls-remote --exit-code origin "refs/tags/$v" >/dev/null; then echo "$v already exists"; exit 1; fi
            echo "Refresh $v" > dist/title.txt
            printf '%s\n' "$NOTES" > dist/notes.md
          fi
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: Build assets
        run: |
          git archive --format=zip --prefix=Refresh/ -o dist/Refresh.zip HEAD
          cp module.json dist/
          (cd dist && sha256sum -b Refresh.zip module.json > SHA256SUMS && cat SHA256SUMS)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$(cat dist/title.txt)" \
            --notes-file dist/notes.md --latest dist/Refresh.zip dist/module.json dist/SHA256SUMS
